name: 每日情報資料更新

# 本站所有資料一律「每日收盤後更新一次」：
#   - 個股收盤報價（realtime.json，證交所 MIS 13:30 收盤即有）
#   - 廣達日線（quanta_latest.json，同時提供交易日曆）
#   - 類股指數對照（index_compare.json）
#   - 三大法人買賣超（institutional.json，證交所收盤後才公布）
#   - 類股新聞（news.json，滾動保留最近 10 天）
#
# 曾經有一支每 5 分鐘跑的盤中報價排程，已移除，理由：
#   1. 高頻 cron 最容易被 GitHub 降級或直接丟棄（實測該 repo 排程從未觸發過）
#   2. 本站其餘資料本來就都是每日的，只有報價宣稱盤中會造成不一致的預期
#   3. 一天 80+ 次強制推送，為了 5 分鐘延遲的報價並不划算
#
# 全部資料直接提交回 main：
#   - 一天只有一個提交，不會污染歷史
#   - 腳本都是增量更新，需要 main 上既有的資料當基準才不會每次重抓
#   - 前端直接從 GitHub Pages 讀同源的 data/*.json，不需要 CORS 繞道

on:
  schedule:
    # UTC 06:10，對應台北時間 14:10（台股 13:30 收盤後）
    - cron: '10 6 * * 1-5'
    # UTC 09:10，對應台北時間 17:10（三大法人數據約 15:00-16:00 才公布，補跑一次）
    - cron: '10 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 收盤報價取自證交所 MIS，13:30 一收盤就有；
      # FinMind 日線有延遲（實測收盤後一小時仍有半數個股沒當日資料），不適合當報價來源。
      - name: 更新個股收盤報價
        run: python scripts/fetch_realtime_quotes.py

      # 順序相依：build_index_compare.py 以 quanta_latest.json 的日線日期當交易日曆，
      # 若不先更新它，指數腳本會判定「沒有新交易日要抓」而永遠停在舊日期。
      - name: 更新廣達日線（提供交易日曆）
        run: python scripts/update_stock.py

      - name: 更新 16 檔類股資料
        continue-on-error: true
        run: python scripts/build_sector_data.py

      - name: 更新類股指數對照資料
        run: python scripts/build_index_compare.py

      # 任一支腳本失敗不應該讓其他資料也停止更新，因此各自獨立並允許失敗
      - name: 更新三大法人買賣超
        continue-on-error: true
        run: python scripts/build_institutional_data.py

      - name: 更新類股新聞
        continue-on-error: true
        run: python scripts/build_news.py

      # 訊號必須排在所有資料之後：build_signals.py 不連網，
      # 只是把上面幾份 JSON 換算成評分與進出場價位。
      - name: 產生投資策略訊號
        continue-on-error: true
        run: python scripts/build_signals.py

      - name: 提交更新
        run: |
          set -euo pipefail

          FILES="data/realtime.json data/quanta_latest.json data/sector_stocks.json data/index_compare.json data/institutional.json data/news.json data/signals.json"

          if git diff --quiet -- $FILES; then
            echo "資料無變動（可能非交易日或尚未收盤），略過提交"
            exit 0
          fi

          python -c "import json;d=json.load(open('data/realtime.json',encoding='utf-8'));print('  報價',d['marketDate'],d['marketTime'],d['count'],'檔')" || true
          python -c "import json;print('  指數',json.load(open('data/index_compare.json',encoding='utf-8'))['count'],'個交易日')" || true
          python -c "import json;d=json.load(open('data/news.json',encoding='utf-8'));print('  新聞',d['count'],'則 /',len(d['perStock']),'檔')" || true
          python -c "import json;d=json.load(open('data/signals.json',encoding='utf-8'));print('  訊號',d['dataDate'],'/ 類股',d['sector']['phase'],'/ 事件',len(d['alerts']),'件')" || true

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: 更新每日情報資料 ($(date -u +'%Y-%m-%d'))"
          git push origin HEAD:main
