name: 每日情報資料更新

# 這些資料都只在收盤後變動，不需要像盤中報價那樣每 5 分鐘跑：
#   - 類股指數對照（index_compare.json）
#   - 三大法人買賣超（institutional.json，證交所收盤後才公布）
#   - 類股新聞（news.json，滾動保留最近 10 天）
#
# 與盤中報價快照不同，這些資料直接提交回 main：
#   - 一天只有一個提交，不會污染歷史
#   - 三支腳本都是增量更新，需要 main 上既有的資料當基準才不會每次重抓
#   - 前端直接從 GitHub Pages 讀同源的 data/*.json

on:
  schedule:
    # UTC 06:10，對應台北時間 14:10（台股 13:30 收盤後）
    - cron: '10 6 * * 1-5'
    # UTC 09:10，對應台北時間 17:10（三大法人數據約 15:00-16:00 才公布，補跑一次）
    - cron: '10 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-index-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 順序相依：build_index_compare.py 以 quanta_latest.json 的日線日期當交易日曆，
      # 若不先更新它，指數腳本會判定「沒有新交易日要抓」而永遠停在舊日期。
      - name: 更新廣達日線（提供交易日曆）
        run: python scripts/update_stock.py

      - name: 更新類股指數對照資料
        run: python scripts/build_index_compare.py

      # 任一支腳本失敗不應該讓其他資料也停止更新，因此各自獨立並允許失敗
      - name: 更新三大法人買賣超
        continue-on-error: true
        run: python scripts/build_institutional_data.py

      - name: 更新類股新聞
        continue-on-error: true
        run: python scripts/build_news.py

      - name: 提交更新
        run: |
          set -euo pipefail

          FILES="data/index_compare.json data/institutional.json data/news.json"

          if git diff --quiet -- $FILES; then
            echo "資料無變動（可能非交易日或尚未收盤），略過提交"
            exit 0
          fi

          python -c "import json;print('  指數',json.load(open('data/index_compare.json',encoding='utf-8'))['count'],'個交易日')" || true
          python -c "import json;print('  新聞',json.load(open('data/news.json',encoding='utf-8'))['count'],'則')" || true

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: 更新每日情報資料 ($(date -u +'%Y-%m-%d'))"
          git push origin HEAD:main
